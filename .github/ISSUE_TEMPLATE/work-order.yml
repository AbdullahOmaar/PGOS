name: Work Order implementation request
description: Propose an implementation issue linked to an approved Notion Work Order.
title: "[WO-ID] "
labels: []
body:
  - type: input
    id: project_id
    attributes:
      label: Project ID
      placeholder: PRJ-EXAMPLE
    validations:
      required: true
  - type: input
    id: work_order
    attributes:
      label: Canonical Notion Work Order URL
    validations:
      required: true
  - type: input
    id: outcome_id
    attributes:
      label: Outcome ID
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given / When / Then, including failure and permission behavior.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan and evidence
    validations:
      required: true