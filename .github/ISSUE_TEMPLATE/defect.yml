name: Defect or governance-tooling issue
description: Report a reproducible defect in the PGOS framework or its validator.
title: "[BUG] "
labels: []
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and sanitized evidence
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety confirmation
      options:
        - label: I have removed secrets and unnecessary personal data.
          required: true