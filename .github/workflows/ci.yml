name: PGOS validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate core synthetic project records
        run: python scripts/validate_records.py examples/sample-project
      - name: Validate extended synthetic adoption records
        run: python -m scripts.extended_records examples/extended-adoption
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -v
